<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Quản lý Quán ABC</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f3f4f6;
color:#111;
}

header{
background:#111;
color:white;
text-align:center;
padding:22px 15px;
}

.container{
max-width:700px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:18px;
margin:15px 0;
border-radius:16px;
box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.hidden{display:none}

input{
width:100%;
padding:13px;
margin:7px 0 12px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
border:0;
border-radius:10px;
padding:12px 15px;
font-weight:bold;
cursor:pointer;
}

.loginBtn{
width:100%;
background:#111;
color:white;
font-size:17px;
}

.logout{
background:#dc2626;
color:white;
}

.refresh{
background:#111;
color:white;
}

.accountBtn{
background:#eee;
width:100%;
}

.error{
background:#fee2e2;
color:#991b1b;
padding:12px;
border-radius:10px;
margin-top:10px;
}

.success{
background:#ecfdf5;
color:#166534;
padding:12px;
border-radius:10px;
margin-top:10px;
}

.newAlert{
background:#dc2626;
color:white;
padding:16px;
border-radius:12px;
text-align:center;
font-size:20px;
font-weight:bold;
margin-bottom:15px;
display:none;
animation:blink 1s infinite;
}

@keyframes blink{
50%{opacity:.55}
}

.order{
background:white;
border-radius:15px;
padding:18px;
margin:15px 0;
box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.order.new{
border-left:6px solid #16a34a;
}

.order.doing{
border-left:6px solid #f59e0b;
}

.order.done{
border-left:6px solid #2563eb;
}

.orderTop{
display:flex;
justify-content:space-between;
gap:10px;
}

.item{
padding:9px 0;
border-bottom:1px solid #eee;
}

.total{
font-size:20px;
font-weight:bold;
margin-top:12px;
}

.status{
padding:6px 10px;
border-radius:20px;
background:#eee;
font-size:13px;
font-weight:bold;
}

.actions{
display:flex;
gap:8px;
margin-top:15px;
}

.actions button{
flex:1;
}

.accept{
background:#16a34a;
color:white;
}

.doneBtn{
background:#2563eb;
color:white;
}

</style>
</head>

<body>

<header>

<h1>👨‍🍳 QUÁN ĂN ABC</h1>

<p>Trang quản lý đơn</p>

</header>


<!-- LOGIN -->

<div
id="loginPage"
class="container"
>

<div class="card">

<h2>🔐 Đăng nhập</h2>

<input
id="loginEmail"
type="email"
placeholder="Email"
/>

<input
id="loginPassword"
type="password"
placeholder="Mật khẩu"
/>

<button
class="loginBtn"
onclick="login()"
>

ĐĂNG NHẬP

</button>

<div id="loginMessage"></div>

</div>

</div>


<!-- ADMIN -->

<div
id="adminPage"
class="container hidden"
>


<div class="card">

<h2>👤 Tài khoản</h2>

<p id="currentEmail"></p>

<button
class="accountBtn"
onclick="toggleAccount()"
>

⚙️ Quản lý tài khoản

</button>


<div
id="accountBox"
class="hidden"
>

<h3>📧 Đổi email</h3>

<input
id="newEmail"
type="email"
placeholder="Email mới"
/>

<button onclick="changeEmail()">
Đổi email
</button>


<h3>🔑 Đổi mật khẩu</h3>

<input
id="newPassword"
type="password"
placeholder="Mật khẩu mới"
/>

<button onclick="changePassword()">
Đổi mật khẩu
</button>

<div id="accountMessage"></div>

</div>

<br>

<button
class="logout"
onclick="logout()"
>

🚪 Đăng xuất

</button>

</div>


<!-- THÔNG BÁO -->

<div
id="newAlert"
class="newAlert"
>

🔔 CÓ ĐƠN MỚI!

</div>


<!-- ĐƠN -->

<div class="card">

<div
style="
display:flex;
justify-content:space-between;
align-items:center;
"
>

<h2>📋 Đơn hàng</h2>

<button
class="refresh"
onclick="loadOrders(true)"
>

🔄

</button>

</div>


<div id="orders">

Đang tải...

</div>

</div>

</div>


<script>


/*
================================
SUPABASE
================================
*/

const SUPABASE_URL =
"https://ivcdkjbxwppnrvcbmtvi.supabase.co";


const SUPABASE_KEY =
"sb_publishable_9zXYN2vMc0cy8PkeDsF5-w_ZytZE69I";


/*
================================
BIẾN
================================
*/

let knownOrders = new Set();

let firstLoad = true;


/*
================================
SUPABASE REQUEST
================================
*/

async function supabaseRequest(
url,
options={}
){

options.headers =
options.headers || {};

options.headers[
"apikey"
] = SUPABASE_KEY;


const token =
localStorage.getItem(
"supabase_access_token"
);


if(token){

options.headers[
"Authorization"
] =
"Bearer " + token;

}


return fetch(
url,
options
);

}


/*
================================
LOGIN
================================
*/

async function login(){

const email =
document
.getElementById("loginEmail")
.value
.trim();


const password =
document
.getElementById("loginPassword")
.value;


if(!email || !password){

showLoginError(
"Vui lòng nhập email và mật khẩu."
);

return;

}


try{

const response =
await fetch(

SUPABASE_URL +
"/auth/v1/token?grant_type=password",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY

},

body:JSON.stringify({

email:email,

password:password

})

}

);


const data =
await response.json();


if(!response.ok){

throw new Error(
data.error_description ||
data.msg ||
"Đăng nhập thất bại."
);

}


localStorage.setItem(
"supabase_access_token",
data.access_token
);

localStorage.setItem(
"supabase_refresh_token",
data.refresh_token
);


showAdmin();


}catch(error){

showLoginError(
error.message
);

}

}


/*
================================
CHECK LOGIN
================================
*/

async function checkLogin(){

const token =
localStorage.getItem(
"supabase_access_token"
);


if(!token){

showLogin();

return;

}


const response =
await supabaseRequest(

SUPABASE_URL +
"/auth/v1/user",

{

headers:{

"Authorization":
"Bearer " + token

}

}

);


if(response.ok){

showAdmin();

}else{

localStorage.removeItem(
"supabase_access_token"
);

showLogin();

}

}


/*
================================
ADMIN
================================
*/

async function showAdmin(){

document
.getElementById("loginPage")
.classList
.add("hidden");


document
.getElementById("adminPage")
.classList
.remove("hidden");


await showUser();

await loadOrders();

}


/*
================================
USER
================================
*/

async function showUser(){

const response =
await supabaseRequest(

SUPABASE_URL +
"/auth/v1/user",

{

headers:{

"Authorization":
"Bearer " +
localStorage.getItem(
"supabase_access_token"
)

}

}

);


if(!response.ok)
return;


const user =
await response.json();


document
.getElementById("currentEmail")
.innerText =
"📧 " + user.email;

}


/*
================================
LOGOUT
================================
*/

async function logout(){

const token =
localStorage.getItem(
"supabase_access_token"
);


if(token){

await fetch(

SUPABASE_URL +
"/auth/v1/logout",

{

method:"POST",

headers:{

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + token

}

}

);

}


localStorage.removeItem(
"supabase_access_token"
);

localStorage.removeItem(
"supabase_refresh_token"
);


location.reload();

}


/*
================================
ACCOUNT
================================
*/

function toggleAccount(){

document
.getElementById("accountBox")
.classList
.toggle("hidden");

}


/*
================================
CHANGE EMAIL
================================
*/

async function changeEmail(){

const email =
document
.getElementById("newEmail")
.value
.trim();


if(!email){

showAccountMessage(
"Nhập email mới.",
false
);

return;

}


const token =
localStorage.getItem(
"supabase_access_token"
);


const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method:"PUT",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + token

},

body:JSON.stringify({

email:email

})

}

);


const data =
await response.json();


if(!response.ok){

showAccountMessage(
data.message ||
"Không đổi được email.",
false
);

return;

}


showAccountMessage(
"✅ Kiểm tra email mới để xác nhận.",
true
);

}


/*
================================
CHANGE PASSWORD
================================
*/

async function changePassword(){

const password =
document
.getElementById("newPassword")
.value;


if(password.length < 6){

showAccountMessage(
"Mật khẩu tối thiểu 6 ký tự.",
false
);

return;

}


const token =
localStorage.getItem(
"supabase_access_token"
);


const response =
await fetch(

SUPABASE_URL +
"/auth/v1/user",

{

method:"PUT",

headers:{

"Content-Type":
"application/json",

"apikey":
SUPABASE_KEY,

"Authorization":
"Bearer " + token

},

body:JSON.stringify({

password:password

})

}

);


const data =
await response.json();


if(!response.ok){

showAccountMessage(
data.message ||
"Không đổi được mật khẩu.",
false
);

return;

}


showAccountMessage(
"✅ Đổi mật khẩu thành công.",
true
);

}


/*
================================
LOAD ORDERS
================================
*/

async function loadOrders(
manual=false
){

try{

const response =
await supabaseRequest(

SUPABASE_URL +
"/rest/v1/orders?select=*&order=created_at.desc",

{

headers:{

"Authorization":
"Bearer " +
localStorage.getItem(
"supabase_access_token"
)

}

}

);


if(!response.ok){

throw new Error(
await response.text()
);

}


const orders =
await response.json();


/*
================================
PHÁT HIỆN ĐƠN MỚI
================================
*/

if(!firstLoad){

const newOrders =
orders.filter(
order =>
!knownOrders.has(
String(order.id)
)
);


if(newOrders.length > 0){

showNewOrderAlert();

playSound();

}

}


knownOrders =
new Set(
orders.map(
order => String(order.id)
)
);


firstLoad=false;


renderOrders(orders);


}catch(error){

document
.getElementById("orders")
.innerHTML = `

<div class="error">

❌ ${escapeHTML(
error.message
)}

</div>

`;

}

}


/*
================================
RENDER
================================
*/

function renderOrders(
orders
){

const box =
document.getElementById("orders");


if(orders.length===0){

box.innerHTML =
"📭 Chưa có đơn hàng.";

return;

}


box.innerHTML="";


orders.forEach(
order => {

const div =
document.createElement("div");


div.className =
"order " +
order.status;


let itemsHTML="";


let items =
typeof order.items === "string"

? JSON.parse(order.items)

: order.items;


items.forEach(
item => {

itemsHTML += `

<div class="item">

🍽️ ${escapeHTML(item.name)}

× ${item.quantity}

<br>

${money(
item.price *
item.quantity
)}

</div>

`;

});


let actions="";


if(order.status==="new"){

actions=`

<button
class="accept"
onclick="changeStatus(${order.id},'doing')"
>

👨‍🍳 Nhận đơn

</button>

`;

}


if(order.status==="doing"){

actions=`

<button
class="doneBtn"
onclick="changeStatus(${order.id},'done')"
>

✅ Hoàn thành

</button>

`;

}


div.innerHTML = `

<div class="orderTop">

<div>

<h3>
Đơn #${order.id}
</h3>

<div>
👤 ${escapeHTML(
order.customer_name
)}
</div>

<div>
🪑 Bàn ${escapeHTML(
order.table_number
)}
</div>

</div>

<span class="status">

${statusText(
order.status
)}

</span>

</div>

<hr>

${itemsHTML}

<div class="total">

💰 ${money(order.total)}

</div>

<div>

📝 ${escapeHTML(
order.note ||
"Không có ghi chú"
)}

</div>

<div class="actions">

${actions}

</div>

`;

box.appendChild(div);

});

}


/*
================================
CHANGE STATUS
================================
*/

async function changeStatus(
id,
status
){

const response =
await supabaseRequest(

SUPABASE_URL +
"/rest/v1/orders?id=eq." +
id,

{

method:"PATCH",

headers:{

"Content-Type":
"application/json",

"Authorization":
"Bearer " +
localStorage.getItem(
"supabase_access_token"
),

"Prefer":
"return=minimal"

},

body:JSON.stringify({

status:status

})

}

);


if(!response.ok){

alert(
"Không cập nhật được đơn."
);

return;

}


loadOrders(true);

}


/*
================================
THÔNG BÁO ĐƠN MỚI
================================
*/

function showNewOrderAlert(){

const alertBox =
document.getElementById(
"newAlert"
);


alertBox.style.display =
"block";


setTimeout(

function(){

alertBox.style.display =
"none";

},

7000

);

}


/*
================================
ÂM THANH
================================
*/

function playSound(){

try{

const AudioContext =
window.AudioContext ||
window.webkitAudioContext;


const audio =
new AudioContext();


const oscillator =
audio.createOscillator();


const gain =
audio.createGain();


oscillator.connect(gain);

gain.connect(
audio.destination
);


oscillator.frequency.value =
880;


gain.gain.value =
0.2;


oscillator.start();


setTimeout(

function(){

oscillator.stop();

audio.close();

},

500

);

}catch(e){

console.log(
"Không phát được âm thanh"
);

}

}


/*
================================
STATUS
================================
*/

function statusText(
status
){

if(status==="new")
return "🆕 Mới";

if(status==="doing")
return "👨‍🍳 Đang làm";

if(status==="done")
return "✅ Hoàn thành";

return status;

}


/*
================================
MONEY
================================
*/

function money(
number
){

return Number(number)
.toLocaleString("vi-VN")
+"đ";

}


/*
================================
ESCAPE
================================
*/

function escapeHTML(
text
){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/*
================================
MESSAGES
================================
*/

function showLoginError(
message
){

document
.getElementById(
"loginMessage"
)
.innerHTML = `

<div class="error">

❌ ${escapeHTML(message)}

</div>

`;

}


function showAccountMessage(
message,
success
){

document
.getElementById(
"accountMessage"
)
.innerHTML = `

<div class="${
success ? "success" : "error"
}">

${escapeHTML(message)}

</div>

`;

}


/*
================================
START
================================
*/

checkLogin();


/*
================================
KIỂM TRA ĐƠN MỖI 3 GIÂY
================================
*/

setInterval(

function(){

const admin =
document.getElementById(
"adminPage"
);


if(
admin &&
!admin.classList.contains(
"hidden"
)
){

loadOrders();

}

},

3000

);

</script>

</body>
</html>
